spring.application.name=ai-knowledge-assistant
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_knowledge_assistant}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.storage.location=${STORAGE_LOCATION:./data/uploads}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:5173}
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.retrieval.max-chunks=${RETRIEVAL_MAX_CHUNKS:6}
app.retrieval.minimum-score=${RETRIEVAL_MINIMUM_SCORE:1}
